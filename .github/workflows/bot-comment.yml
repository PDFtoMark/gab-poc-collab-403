name: bot-comment
on:
  workflow_dispatch:
    inputs:
      issue:
        required: true
permissions:
  issues: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - name: Post /ai comment as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${{ inputs.issue }}/comments" -f body="/ai hello from the actions bot" --jq '{id,user:.user.login}'
